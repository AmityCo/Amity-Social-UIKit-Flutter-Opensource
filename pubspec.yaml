name: amity_uikit_beta_service
description: Amity UIkit opensource developed by SLE team to enable social feature in Flutter.
version: 4.21.0
homepage: https://github.com/ThanakornThanom/ThanakornThanom--flutter_amity_uikit_beta_service

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2 # Use the version compatible with your Flutter version
  plugin_platform_interface: ^2.0.2
  flutter_bloc: ^9.1.1
  amity_sdk: ^7.8.8
  image_gallery_saver_plus: ^4.0.1
  dio: ^5.9.2
  provider: ^6.0.3
  chewie: ^1.14.1
  video_player: ^2.9.2
  # extended_image: ^6.2.1
  image_picker: ^1.2.2
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.1
  shimmer: ^3.0.0
  any_link_preview: ^3.0.3
  linkify: ^5.0.0
  url_launcher: ^6.1.6
  path_provider: ^2.0.2
  flutter_video_thumbnail: 0.0.2
  mime: ^2.0.0
  # Exact pin: 12.0.0 stable (2026-08-14) drops FilePickerResult, which
  # post_composer_file_picker.dart and create_postV2_viewmodel.dart still use.
  # ^12.0.0-beta.3 resolves to that stable and breaks every fresh checkout.
  file_picker: 12.0.0-beta.7
  open_file: ^3.5.11
  flutter_svg: ^2.3.0
  permission_handler: ^12.0.1
  flutter_linkify: ^6.0.0
  camera: ^0.12.0+1
  equatable: ^2.0.8
  cached_network_image: ^3.4.1
  validators: ^3.0.0
  visibility_detector: ^0.4.0+2
  package_info_plus: ^10.1.0
  device_info_plus: ^13.1.0
  palette_generator: ^0.3.3+7
  connectivity_plus: ^7.1.1
  photo_manager: ^3.9.0
  diff_match_patch: ^0.4.1
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen: ^5.14.1 # Optional but useful for code generation


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      # This plugin project was generated without specifying any
      # platforms with the `--platform` argument. If you see the `some_platform` map below, remove it and
      # then add platforms following the instruction here:
      # https://flutter.dev/docs/development/packages-and-plugins/developing-packages#plugin-platforms
      # -------------------
      some_platform:
        pluginClass: somePluginClass
    # -------------------

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/images/IMG_5637.JPG
    - assets/images/fileType/
    - assets/Icons/
    - assets/images/Icon name.png
    - assets/images/user_placeholder.png
    - assets/images/noPostYet.png
    - assets/images/privateIcon.png
    - assets/images/noVideo.png
    - assets/config/config.json
    - assets/
    - assets/lang/

  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Material-Design-Iconic-Font
      fonts:
        - asset: assets/fonts/Material-Design-Iconic-Font.ttf

  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages
